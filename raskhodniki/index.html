<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Расходники</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-muted:#F0F0F0;
    --text:#111111;
    --text-muted:#6E6E6E;
    --accent:#111111;
    --accent-contrast:#FFFFFF;
    --border:#DDDDDD;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0F0F0F;
      --surface:#1A1A1A;
      --surface-muted:#262626;
      --text:#F2F2F2;
      --text-muted:#9A9A9A;
      --accent:#F2F2F2;
      --accent-contrast:#0F0F0F;
      --border:#333333;
    }
  }
  html[data-theme="light"]{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-muted:#F0F0F0;
    --text:#111111;
    --text-muted:#6E6E6E;
    --accent:#111111;
    --accent-contrast:#FFFFFF;
    --border:#DDDDDD;
  }
  html[data-theme="dark"]{
    --bg:#0F0F0F;
    --surface:#1A1A1A;
    --surface-muted:#262626;
    --text:#F2F2F2;
    --text-muted:#9A9A9A;
    --accent:#F2F2;
    --accent-contrast:#0F0F0F;
    --border:#333333;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    padding-bottom:96px;
  }
  header{
    padding:22px 18px 14px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
    border-bottom:1px solid var(--border);
  }
  .header-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  h1{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:700;
    font-size:21px;
    letter-spacing:-0.01em;
    line-height:1.15;
    margin:0 0 3px;
  }
  .subtitle{
    font-size:13px;
    color:var(--text-muted);
    margin:0;
  }
  .edit-toggle{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--text-muted);
    font-size:16px;
  }
  .edit-toggle.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-contrast);
  }
  .summary{
    display:flex;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  .pill{
    font-size:12.5px;
    pading:5px 11px;
    border-radius:100px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-muted);
  }
  .pill.low{background:var(--surface-muted);color:var(--text);border-color:transparent;}
  .pill.out{background:var(--accent);color:var(--accent-contrast);border-color:transparent;}

  main{padding:6px 14px 0;flex:1;}
  .category{margin-top:22px;}
  .category-label{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-size:12px;
    color:var(--text-muted);
    margin:0 4px 8px;
  }
  .items{
    background:var(--surface);
    border-radius:var(--radius);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 14px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    user-select:none;
    transition:background .15s ease;
  }
  .item:last-child{border-bottom:none;}
  .item[data-state="low"]{background:var(--surface-muted);}
  .item[data-state="out"]{background:var(--accent);}
  .item-name{
    font-size:15px;
    line-height:1.35;
    flex:1;
    padding-right:10px;
  }
  .item[data-state="low"] .item-name,
  .item[data-state="out"] .item-name{font-weight:600;}
  .item[data-state="out"] .item-name{color:var(--accent-contrast);}
  .state-chip{
    font-size:12px;
    color:var(--text-muted);
    flex:0 0 auto;
    min-width:30px;
    text-align:right;
  }
  .item[data-state="low"] .state-chip{color:var(--text);}
  .item[data-state="out"] .state-chip{color:var(--accent-contrast);}
  .item-delete{
    margin-left:10px;
    width:26px;
    height:26px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:var(--accent-contrast);
    font-size:14px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
  }
  .add-row{
    display:flex;
    gap:8px;
    padding:10px 14px;
    background:var(--surface-muted);
  }
  .add-row input{
    flex:1;
    border:1px solid var(--border);
    border-radius:9px;
    padding:8px 10px;
    font-size:14px;
    font-family:inherit;
    background:var(--surface);
    color:var(--text);
  }
  .add-row button{
    border:none;
    background:var(--accent);
    color:var(--accent-contrast);
    border-radius:9px;
    padding:0 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .add-category{
    margin-top:18px;
    width:100%;
    padding:12px;
    border-radius:var(--radius);
    border:1px dashed var(--border);
    background:transparent;
    color:var(--text-muted);
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
  }
  .restore-defaults{
    display:block;
    margin:22px auto 4px;
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
  }

  .actionbar{
    position:fixed;
    bottom:0;left:0;right:0;
    display:flex;
    justify-content:center;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .actionbar-inner{
    max-width:480px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .actionbar-row{
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:12px;
    border:none;
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-secondary{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn-primary{
    background:var(--accent);
    color:var(--accent-contrast);
  }
  .btn-primary:disabled{
    background:var(--surface-muted);
    color:var(--text-muted);
    cursor:default;
  }
  .btn-secondary:disabled{
    color:var(--text-muted);
    cursor:default;
  }
  .btn:focus-visible, .edit-toggle:focus-visible, .item:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.5);
    display:flex;
    align-items:flex-end;
    z-index:20;
  }
  .sheet{
    background:var(--surface);
    width:100%;
    max-width:480px;
    margin:0 auto;
    border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet h2{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:700;
    font-size:17px;
    margin:0 0 12px;
  }
  .sheet textarea{
    width:100%;
    min-height:160px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    background:var(--surface-muted);
    resize:vertical;
    margin-bottom:14px;
  }
  .sheet-actions{display:flex;flex-direction:column;gap:9px;}
  .sheet-actions a, .sheet-actions button{text-decoration:none;text-align:center;}
  .copied-note{
    font-size:12.5px;
    color:var(--accent);
    text-align:center;
    margin:8px 0 0;
    min-height:16px;
  }
  .copied-note.send-error{
    color:var(--text);
    font-weight:700;
  }
  .loading, .empty{
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
    padding:60px 20px;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading">Загружаем список…</div>
</div>

<script>
(function(){
  'use strict';

  /* =========================================================
     CONFIG — все константы и настройки приложения в одном месте
     ========================================================= */
  var Config = {
    STORAGE_KEY: 'raskhodniki-data-v1',

    STATE_ORDER: ['ok', 'low', 'out'],
    STATE_LABEL: { ok: '', low: 'мало', out: 'нет' },

    DEFAULT_DATA: {
      categories: [
        { id:'c1', name:'Уборка и гигиена', items:[
          {id:'i1', name:'Тряпки для чабаней', state:'ok'},
          {id:'i2', name:'Губки для мытья посуды', state:'ok'},
          {id:'i3', name:'Мусорные мешки', state:'ok'},
          {id:'i4', name:'Бумажные полотенца', state:'ok'},
          {id:'i5', name:'Туалетная бумага', state:'ok'}
        ]},
        { id:'c2', name:'Печать и касса', items:[
          {id:'i6', name:'Наклейки для принтера (70x50)', state:'ok'},
          {id:'i7', name:'Чеки для терминала', state:'ok'},
          {id:'i8', name:'Чеки для кассы', state:'ok'},
          {id:'i9', name:'Риббон', state:'ok'}
        ]},
        { id:'c3', name:'Упаковка', items:[
          {id:'i10', name:'Конверты для блинов прозрачные (35х20)', state:'ok'},
          {id:'i11', name:'Конверты для блинов', state:'ok'},
          {id:'i12', name:'Пакеты для банок (29.5х20)', state:'ok'},
          {id:'i13', name:'Крафтовые пакеты маленькие с ручками (21,5х24,5)', state:'ok'},
          {id:'i14', name:'Крафтовые пакеты большие с ручками', state:'ok'},
          {id:'i15', name:'Крафтовые пакеты маленькие', state:'ok'},
          {id:'i16', name:'Зип пакеты', state:'ok'},
          {id:'i17', name:'Зип пакет чёрный (12x8)', state:'ok'},
          {id:'i18', name:'Зип пакет белый (12x8)', state:'ok'}
        ]},
        { id:'c4', name:'Посуда и подача', items:[
          {id:'i19', name:'Капхолдеры', state:'ok'},
          {id:'i20', name:'Сито для стаканов', state:'ok'},
          {id:'i21', name:'Стаканы (для трав)', state:'ok'},
          {id:'i22', name:'Стаканы (чай с собой)', state:'ok'},
          {id:'i23', name:'Крышки (чай с собой)', state:'ok'}
        ]},
        { id:'c5', name:'Прочее', items:[
          {id:'i24', name:'Лампочки', state:'ok'}
        ]}
      ]
    }
  };

  /* =========================================================
     STORE (МОДЕЛЬ) — вся работа с данными и localStorage.
     Ничего не знает про DOM/HTML.
     ========================================================= */
  var Store = {
    data: null,

    /* --- утилиты --- */
    _uid: function(prefix){
      return prefix + Math.random().toString(36).slice(2, 9);
    },
    _clone: function(obj){
      return JSON.parse(JSON.stringify(obj));
    },
    _findCategory: function(catId){
      return this.data.categories.find(function(c){ return c.id === catId; });
    },
    _findItem: function(catId, itemId){
      var cat = this._findCategory(catId);
      return cat ? cat.items.find(function(i){ return i.id === itemId; }) : null;
    },
    _cycleState: function(current){
      var idx = Config.STATE_ORDER.indexOf(current);
      return Config.STATE_ORDER[(idx + 1) % Config.STATE_ORDER.length];
    },
    _todayStr: function(){
      var d = new Date();
      var dd = String(d.getDate()).padStart(2, '0');
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      return dd + '.' + mm + '.' + d.getFullYear();
    },

    /* --- персистентность --- */
    load: function(){
      try{
        var raw = localStorage.getItem(Config.STORAGE_KEY);
        if(raw){
          this.data = JSON.parse(raw);
          return;
        }
      }catch(e){
        // хранилище недоступно или пусто — используем данные по умолчанию
      }
      this.data = this._clone(Config.DEFAULT_DATA);
      this.save();
    },
    save: function(){
      try{
        localStorage.setItem(Config.STORAGE_KEY, JSON.stringify(this.data));
      }catch(e){
        console.error('Не удалось сохранить список', e);
      }
    },
    restoreDefaults: function(){
      this.data = this._clone(Config.DEFAULT_DATA);
      this.save();
    },

    /* --- мутации состояния позиций --- */
    toggleItemState: function(catId, itemId){
      var item = this._findItem(catId, itemId);
      if(!item) return;
      item.state = this._cycleState(item.state);
      this.save();
    },
    resetAllStates: function(){
      this.data.categories.forEach(function(cat){
        cat.items.forEach(function(it){ it.state = 'ok'; });
      });
      this.save();
    },

    /* --- CRUD позиций --- */
    addItem: function(catId, name){
      var cat = this._findCategory(catId);
      if(!cat || !name.trim()) return;
      cat.items.push({ id: this._uid('i'), name: name.trim(), state: 'ok' });
      this.save();
    },
    deleteItem: function(catId, itemId){
      var cat = this._findCategory(catId);
      if(!cat) return;
      cat.items = cat.items.filter(function(i){ return i.id !== itemId; });
      this.save();
    },
    renameItem: function(catId, itemId, newName){
      var item = this._findItem(catId, itemId);
      if(!item || !newName.trim()) return;
      item.name = newName.trim();
      this.save();
    },

    /* --- CRUD категорий --- */
    addCategory: function(name){
      if(!name.trim()) return;
      this.data.categories.push({ id: this._uid('c'), name: name.trim(), items: [] });
      this.save();
    },

    /* --- агрегаты --- */
    counts: function(){
      var low = 0, out = 0;
      this.data.categories.forEach(function(cat){
        cat.items.forEach(function(it){
          if(it.state === 'low') low++;
          if(it.state === 'out') out++;
        });
      });
      return { low: low, out: out };
    },

    /* --- сборка финального текста заявки --- */
    buildMessage: function(){
      var out = [], low = [];
      this.data.categories.forEach(function(cat){
        cat.items.forEach(function(it){
          if(it.state === 'out') out.push(it.name);
          else if(it.state === 'low') low.push(it.name);
        });
      });
      if(!out.length && !low.length) return null;

      var lines = ['Расходники на закупку (' + this._todayStr() + '):', ''];
      if(out.length){
        lines.push('Закончилось:');
        out.forEach(function(n){ lines.push('- ' + n); });
        lines.push('');
      }
      if(low.length){
        lines.push('Мало, есть остаток:');
        low.forEach(function(n){ lines.push('- ' + n); });
      }
      return lines.join('\n').trim();
    }
  };

  /* =========================================================
     UI (ПРЕДСТАВЛЕНИЕ) — чистые функции: данные -> HTML-строка.
     Никаких побочных эффектов, никакой работы с localStorage.
     ========================================================= */
  var UI = {
    escapeHtml: function(s){
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    },

    renderHeader: function(counts, editMode){
      var summary;
      if(counts.out || counts.low){
        summary =
          (counts.out ? '<span class="pill out">закончилось: ' + counts.out + '</span>' : '') +
          (counts.low ? '<span class="pill low">мало: ' + counts.low + '</span>' : '');
      }else{
        summary = '<span class="pill">пока всё в порядке</span>';
      }
      return (
        '<header>' +
          '<div class="header-row">' +
            '<div><h1>Расходники</h1><p class="subtitle">еженедельная проверка</p></div>' +
            '<button class="edit-toggle' + (editMode ? ' active' : '') + '" data-action="toggle-edit" aria-label="Редактировать список">' + (editMode ? '✓' : '✎') + '</button>' +
          '</div>' +
          '<div class="summary">' + summary + '</div>' +
        '</header>'
      );
    },

    renderItem: function(cat, item, editMode){
      var self = this;
      var body = editMode
        ? (
            '<span class="item-name" data-action="rename-item" data-cat="' + cat.id + '" data-item="' + item.id + '">' + self.escapeHtml(item.name) + '</span>' +
            '<button class="item-delete" data-action="delete-item" data-cat="' + cat.id + '" data-item="' + item.id + '" aria-label="Удалить">×</button>'
          )
        : (
            '<span class="item-name">' + self.escapeHtml(item.name) + '</span>' +
            '<span class="state-chip">' + Config.STATE_LABEL[item.state] + '</span>'
          );

      return (
        '<div class="item" tabindex="0" data-state="' + item.state + '" ' +
             (editMode ? '' : 'data-action="toggle-item" ') +
             'data-cat="' + cat.id + '" data-item="' + item.id + '">' +
          body +
        '</div>'
      );
    },

    renderCategory: function(cat, editMode){
      var self = this;
      var itemsHtml = cat.items.map(function(item){ return self.renderItem(cat, item, editMode); }).join('');

      var addRow = editMode
        ? (
            '<div class="add-row">' +
              '<input type="text" placeholder="Новая позиция…" data-role="add-input" data-cat="' + cat.id + '">' +
              '<button data-action="add-item" data-cat="' + cat.id + '">Добавить</button>' +
            '</div>'
          )
        : '';

      return (
        '<div class="category" data-cat="' + cat.id + '">' +
          '<p class="category-label">' + self.escapeHtml(cat.name) + '</p>' +
          '<div class="items">' + itemsHtml + '</div>' +
          addRow +
        '</div>'
      );
    },

    renderMain: function(categories, editMode){
      var self = this;
      var categoriesHtml = categories.map(function(cat){ return self.renderCategory(cat, editMode); }).join('');

      var editExtras = editMode
        ? (
            '<button class="add-category" data-action="add-category">+ Добавить категорию</button>' +
            '<button class="restore-defaults" data-action="restore-defaults">Восстановить список по умолчанию</button>'
          )
        : '';

      return '<main>' + categoriesHtml + editExtras + '</main>';
    },

    renderActionbar: function(hasMessage){
      var disabledAttr = hasMessage ? '' : 'disabled';
      return (
        '<div class="actionbar"><div class="actionbar-iner">' +
          '<button class="btn btn-primary" data-action="open-send-sheet" ' + disabledAttr + '>Отправить список</button>' +
          '<div class="actionbar-row">' +
            '<button class="btn btn-secondary" data-action="reset-all">Сбросить</button>' +
            '<button class="btn btn-secondary" data-action="copy-list" ' + disabledAttr + '>Скопировать</button>' +
          '</div>' +
        '</div></div>'
      );
    },

    renderApp: function(state){
      var msg = state.message;
      return (
        this.renderHeader(state.counts, state.editMode) +
        this.renderMain(state.categories, state.editMode) +
        this.renderActionbar(!!msg)
      );
    },

    renderSendSheet: function(message){
      return (
        '<div class="overlay" data-role="overlay">' +
          '<div class="sheet">' +
            '<h2>Список на закупку</h2>' +
            '<textarea id="msgArea" readonly>' + this.escapeHtml(message) + '</textarea>' +
            '<div class="sheet-actions">' +
              '<button class="btn btn-primary" data-action="send-tg">Отправить в группу</button>' +
              '<button class="btn btn-secondary" data-action="copy-sheet-text">Скопировать текст</button>' +
              '<button class="btn btn-secondary" data-action="close-sheet">Закрыть</button>' +
            '</div>' +
            '<p class="copied-note" id="statusNote"></p>' +
          '</div>' +
        '</div>'
      );
    }
  };

  /* =========================================================
     CONTROLLER — связывает Store и UI, обрабатывает события
     через делегирование на document.body (единственный listener).
     ========================================================= */
  var App = {
    editMode: false,
    appEl: null,

    init: function(){
      this.appEl = document.getElementById('app');
      this.initTelegram();
      Store.load();
      this.render();
      this.initEvents();
    },

    /* --- сборка текущего состояния для UI.renderApp --- */
    getViewState: function(){
      return {
        categories: Store.data.categories,
        counts: Store.counts(),
        message: Store.buildMessage(),
        editMode: this.editMode
      };
    },

    render: function(){
      this.appEl.innerHTML = UI.renderApp(this.getViewState());
    },

    /* --- единая точка входа для всех кликов приложения --- */
    initEvents: function(){
      document.body.addEventListener('click', this.handleClick.bind(this));
      document.body.addEventListener('keydown', this.handleKeydown.bind(this));
    },

    handleKeydown: function(e){
      if(e.key !== 'Enter' && e.key !== ' ') return;

      var addInput = e.target.closest('[data-role="add-input"]');
      if(addInput){
        e.preventDefault();
        this.addItem(addInput.getAttribute('data-cat'), addInput.value);
        return;
      }

      var itemRow = e.target.closest('.item[data-action="toggle-item"]');
      if(itemRow){
        e.preventDefault();
        this.toggleItem(itemRow.getAttribute('data-cat'), itemRow.getAttribute('data-item'));
      }
    },

    handleClick: function(e){
      var overlay = e.target.closest('[data-role="overlay"]');
      if(overlay && e.target === overlay){
        this.closeSendSheet();
        return;
      }

      var target = e.target.closest('[data-action]');
      if(!target) return;

      var action = target.getAttribute('data-action');
      var catId = target.getAttribute('data-cat');
      var itemId = target.getAttribute('data-item');

      switch(action){
        case 'toggle-edit':
          this.editMode = !this.editMode;
          this.render();
          break;

        case 'toggle-item':
          this.toggleItem(catId, itemId);
          break;

        case 'rename-item':
          e.stopPropagation();
          this.renameItem(catId, itemId);
          break;

        case 'delete-item':
          e.stopPropagation();
          Store.deleteItem(catId, itemId);
          this.render();
          break;

        case 'add-item':
          this.addItem(catId, this.getAddInputValue(catId));
          break;

        case 'add-category':
          this.addCategory();
          break;

        case 'restore-defaults':
          if(confirm('Заменить текущий список списком по умолчанию? Текущие позиции и отметки будут потеряны.')){
            Store.restoreDefaults();
            this.render();
          }
          break;

        case 'reset-all':
          Store.resetAllStates();
          this.render();
          break;

        case 'copy-list':
          this.copyToClipboard(Store.buildMessage(), target);
          break;

        case 'open-send-sheet':
          this.openSendSheet();
          break;

        case 'close-sheet':
          this.closeSendSheet();
          break;

        case 'copy-sheet-text':
          this.copyToClipboard(Store.buildMessage(), null, document.getElementById('statusNote'));
          break;

        case 'send-tg':
          this.sendViaWebApp(target);
          break;
      }
    },

    /* --- операции над позициями --- */
    toggleItem: function(catId, itemId){
      if(this.editMode) return;
      Store.toggleItemState(catId, itemId);
      this.render();
    },

    renameItem: function(catId, itemId){
      var item = Store._findItem(catId, itemId);
      if(!item) return;
      var next = prompt('Название позиции:', item.name);
      if(next && next.trim()){
        Store.renameItem(catId, itemId, next);
        this.render();
      }
    },

    getAddInputValue: function(catId){
      var input = document.querySelector('[data-role="add-input"][data-cat="' + catId + '"]');
      return input ? input.value : '';
    },

    addItem: function(catId, rawValue){
      var val = (rawValue || '').trim();
      if(!val) return;
      Store.addItem(catId, val);
      this.render();
    },

    addCategory: function(){
      var name = prompt('Название категории:');
      if(name && name.trim()){
        Store.addCategory(name);
        this.render();
      }
    },

    /* --- копирование в буфер --- */
    copyToClipboard: function(message, btnEl, noteEl){
      if(!message) return;
      var restoreBtnText = null;
      if(btnEl){
        restoreBtnText = btnEl.textContent;
      }

      function onSuccess(){
        if(btnEl){
          btnEl.textContent = 'Скопировано ✓';
          setTimeout(function(){ btnEl.textContent = restoreBtnText; }, 1800);
        }
        if(noteEl){
          noteEl.classList.remove('send-error');
          noteEl.textContent = 'Скопировано ✓';
        }
      }

      function onFailure(){
        if(btnEl){
          btnEl.textContent = 'Не удалось скопировать';
          setTimeout(function(){ btnEl.textContent = restoreBtnText; }, 1800);
        }
        if(noteEl){
          noteEl.textContent = 'Не удалось скопировать — выделите текст вручную';
        }
      }

      navigator.clipboard.writeText(message).then(onSuccess, function(){
        var area = document.createElement('textarea');
        area.value = message;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.focus();
        area.select();
        try{
          document.execCommand('copy');
          onSuccess();
        }catch(e2){
          onFailure();
        }
        document.body.removeChild(area);
      });
    },

    /* --- модальный лист отправки --- */
    openSendSheet: function(){
      var msg = Store.buildMessage();
      if(!msg) return;
      var wrapper = document.createElement('div');
      wrapper.innerHTML = UI.renderSendSheet(msg);
      document.body.appendChild(wrapper.firstElementChild);
    },

    closeSendSheet: function(){
      var overlay = document.querySelector('[data-role="overlay"]');
      if(overlay) overlay.remove();
    },

    /* --- отправка данных нативным способом Telegram Mini Apps --- */
    sendViaWebApp: function(btnEl){
      var msg = Store.buildMessage();
      var note = document.getElementById('statusNote');
      if(!msg){
        return;
      }

      if(!window.Telegram || !window.Telegram.WebApp || typeof window.Telegram.WebApp.sendData !== 'function'){
        if(note){
          note.classList.add('send-error');
          note.textContent = 'Отправка доступна только внутри Telegram.';
        }
        return;
      }

      btnEl.disabled = true;
      btnEl.textContent = 'Отправляем…';

      var payload = JSON.stringify({ messageText: msg });

      Store.resetAllStates();
      window.Telegram.WebApp.sendData(payload);
      window.Telegram.WebApp.close();
    },

    /* --- интеграция с Telegram WebApp (тема, инициализация) --- */
    applyTelegramTheme: function(tg){
      document.documentElement.setAttribute('data-theme', tg.colorScheme === 'dark' ? 'dark' : 'light');
    },

    initTelegram: function(){
      if(!window.Telegram || !window.Telegram.WebApp) return;
      var tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      this.applyTelegramTheme(tg);
      if(tg.onEvent){
        tg.onEvent('themeChanged', this.applyTelegramTheme.bind(this, tg));
      }
    }
  };

  App.init();
})();
</script>
