<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Касса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface2: #f0f0f0;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.14);
  --text: #111111;
  --muted: #6e6e6e;
  --hint: #9a9a9a;
  --accent: #111111;
  --accent-contrast: #ffffff;
  --accent-light: #444444;
  --accent-dim: rgba(0,0,0,0.06);
  --radius: 16px;
  --radius-sm: 10px;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #262626;
    --border: rgba(255,255,255,0.09);
    --border2: rgba(255,255,255,0.16);
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --hint: #7a7a7a;
    --accent: #f2f2f2;
    --accent-contrast: #0f0f0f;
    --accent-light: #bbbbbb;
    --accent-dim: rgba(255,255,255,0.08);
  }
}

html[data-theme="light"]{
  --bg: #ffffff;
  --surface: #ffffff;
  --surface2: #f0f0f0;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.14);
  --text: #111111;
  --muted: #6e6e6e;
  --hint: #9a9a9a;
  --accent: #111111;
  --accent-contrast: #ffffff;
  --accent-light: #444444;
  --accent-dim: rgba(0,0,0,0.06);
}

html[data-theme="dark"]{
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #262626;
  --border: rgba(255,255,255,0.09);
  --border2: rgba(255,255,255,0.16);
  --text: #f2f2f2;
  --muted: #9a9a9a;
  --hint: #7a7a7a;
  --accent: #f2f2f2;
  --accent-contrast: #0f0f0f;
  --accent-light: #bbbbbb;
  --accent-dim: rgba(255,255,255,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 460px;
  margin: 0 auto;
  padding: 2rem 1.25rem 5rem;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2rem;
}

.logo {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
}

.date-chip {
  font-size: 12px;
  color: var(--muted);
  font-weight: 300;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 5px 12px;
}

.heroes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}

.hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  position: relative;
  overflow: hidden;
}

.hero.primary::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent-light), transparent 70%);
}

.hero-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--hint);
  font-weight: 500;
  margin-bottom: 10px;
}

.hero-val {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 26px;
  font-weight: 300;
  letter-spacing: -0.03em;
  color: var(--accent);
  line-height: 1;
}

.hero-val.secondary {
  color: var(--text);
}

.hero-sub {
  margin-top: 6px;
  font-size: 11px;
  color: var(--hint);
  font-weight: 300;
  line-height: 1.4;
  min-height: 15px;
}

.rash-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
}

.rash-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--hint);
  font-weight: 500;
}

.rash-val {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 15px;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: -0.02em;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 8px;
}

.sec-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--hint);
  font-weight: 500;
  margin-bottom: 14px;
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
}

.row:last-of-type { border-bottom: none; }

.row-label {
  font-size: 14px;
  color: var(--muted);
  font-weight: 300;
  white-space: nowrap;
  margin-right: 12px;
}

.row-label.dim { color: var(--hint); }

.row-input {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

input[type="number"] {
  width: 118px;
  text-align: right;
  font-size: 15px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 300;
  color: var(--text);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  outline: none;
  letter-spacing: -0.02em;
  transition: border-color 0.15s;
  -moz-appearance: textfield;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type="number"]:focus { border-color: var(--accent); }

input[type="text"] {
  font-size: 13px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 400;
  color: var(--text);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  outline: none;
  transition: border-color 0.15s;
}

input[type="text"]:focus { border-color: var(--accent); }
input::placeholder { color: var(--hint); }

.cur { font-size: 12px; color: var(--hint); }

.total-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
  margin-top: 4px;
  border-top: 1px solid var(--border2);
}

.total-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
}

.total-val {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 16px;
  font-weight: 300;
  color: var(--accent);
  letter-spacing: -0.02em;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.chips:empty { display: none; }

.chip {
  font-size: 12px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 400;
  color: var(--muted);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 6px 12px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.chip:hover { color: var(--accent); border-color: var(--accent-light); }
.chip:active { transform: scale(0.96); }

.exp-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
}

.exp-item:last-of-type { border-bottom: none; }
.exp-name { flex: 1; min-width: 0; }

.exp-sum-wrap {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.exp-sum-wrap input { width: 96px; }

.del-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--hint);
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
  font-size: 17px; line-height: 1;
  flex-shrink: 0;
  transition: color 0.15s, background 0.15s;
}

.del-btn:hover { color: var(--accent-contrast); background: var(--accent); }

.add-exp-btn {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  font-size: 12px;
  font-family: 'IBM Plex Sans', sans-serif;
  color: var(--hint);
  background: none;
  border: 1px dashed var(--border2);
  border-radius: var(--radius-sm);
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}

.add-exp-btn:hover { color: var(--accent); border-color: var(--accent-light); background: var(--accent-dim); }

.diff-ok {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px; color: var(--text);
  margin-top: 12px; font-weight: 500;
}

.diff-err {
  display: flex; align-items: center; gap: 8px;
  background: var(--accent);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px; color: var(--accent-contrast);
  margin-top: 12px; font-weight: 600;
}

.copy-btn {
  width: 100%;
  margin-top: 1.25rem;
  padding: 16px;
  font-size: 13px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 600;
  color: var(--accent-contrast);
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: opacity 0.15s, transform 0.1s;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}

.copy-btn:hover { opacity: 0.85; }
.copy-btn:active { transform: scale(0.98); }
.copy-btn:disabled { opacity: 0.55; pointer-events: none; }

.copy-btn.outline {
  margin-top: 8px;
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--border2);
}
.copy-btn.outline:hover { background: var(--accent-dim); opacity: 1; }

.copy-btn svg {
  width: 15px; height: 15px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  flex-shrink: 0;
}

.clear-btn {
  display: block;
  margin: 1.5rem auto 0;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-family: 'IBM Plex Sans', sans-serif;
  color: var(--hint);
  letter-spacing: 0.04em;
  padding: 8px 16px;
  transition: color 0.15s;
}
.clear-btn:hover { color: var(--muted); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.app > * { animation: fadeUp 0.4s cubic-bezier(.16,1,.3,1) both; }
header            { animation-delay: 0.04s; }
.heroes           { animation-delay: 0.08s; }
.rash-row         { animation-delay: 0.11s; }
.card:nth-child(4){ animation-delay: 0.14s; }
.card:nth-child(5){ animation-delay: 0.16s; }
.card:nth-child(6){ animation-delay: 0.18s; }
.copy-btn         { animation-delay: 0.21s; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">Касса</div>
    <div class="date-chip" id="date-label"></div>
  </header>

  <div class="heroes">
    <div class="hero primary">
      <div class="hero-label">Итог</div>
      <div class="hero-val" id="m-itog">—</div>
      <div class="hero-sub" id="itog-sub"></div>
    </div>
    <div class="hero">
      <div class="hero-label">В кассе</div>
      <div class="hero-val secondary" id="m-kassa">—</div>
      <div class="hero-sub" id="kassa-sub"></div>
    </div>
  </div>

  <div class="rash-row">
    <span class="rash-label">Расходы</span>
    <span class="rash-val" id="m-rash">—</span>
  </div>

  <div class="card">
    <div class="sec-title">Итог</div>
    <div class="row">
      <span class="row-label">Нал</span>
      <div class="row-input">
        <input type="number" id="nal" placeholder="0" min="0" inputmode="decimal" oninput="calc()">
        <span class="cur">₽</span>
      </div>
    </div>
    <div class="row">
      <span class="row-label">Безнал</span>
      <div class="row-input">
        <input type="number" id="beznal" placeholder="0" min="0" inputmode="decimal" oninput="calc()">
        <span class="cur">₽</span>
      </div>
    </div>
    <div class="row">
      <span class="row-label">Безнал QR</span>
      <div class="row-input">
        <input type="number" id="beznal_qr" placeholder="0" min="0" inputmode="decimal" oninput="calc()">
        <span class="cur">₽</span>
      </div>
    </div>
    <div class="row">
      <span class="row-label">QR (СБП)</span>
      <div class="row-input">
        <input type="number" id="qr" placeholder="0" min="0" inputmode="decimal" oninput="calc()">
        <span class="cur">₽</span>
      </div>
    </div>
    <div class="total-row">
      <span class="total-label">Итого</span>
      <span class="total-val" id="itog-val">0 ₽</span>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">Расходы</div>
    <div class="chips" id="chips"></div>
    <div id="exp-list"></div>
    <button class="add-exp-btn" onclick="addExp()">+ добавить расход</button>
  </div>

  <div class="card">
    <div class="sec-title">В кассе (наличные)</div>
    <div class="row">
      <span class="row-label">Инкассация</span>
      <div class="row-input">
        <input type="number" id="incass" placeholder="0" min="0" inputmode="decimal" oninput="calc()">
        <span class="cur">₽</span>
      </div>
    </div>
    <div class="row" style="border-bottom:none">
      <span class="row-label">Нал факт</span>
      <div class="row-input">
        <input type="number" id="fakt_nal" placeholder="0" min="0" inputmode="decimal" oninput="calc()">
        <span class="cur">₽</span>
      </div>
    </div>
    <div id="diff-block"></div>
  </div>

  <button class="copy-btn" onclick="copyReport()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
    <span id="btn-text">Скопировать отчёт</span>
  </button>

  <button class="copy-btn outline" id="send-btn" onclick="sendReport()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="3" x2="12" y2="21"/>
    </svg>
    <span id="send-btn-text">Сохранить в таблицу</span>
  </button>

  <button class="clear-btn" onclick="clearAll()">очистить форму</button>

</div>
<script>
  /* ==================== НАСТРОЙКИ ==================== */
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxP_pXHDuW-d6Ipd_trV50fW8yaWwsjms16FQRK2xJbnFmG1_bnBXVeFprY_-SW0A9B/exec'; // ← СЮДА ВСТАВЬТЕ URL веб-приложения (тот же, что работает сейчас)
  const APP_KEY = 'kassa_9tX4mQ7vLp2w'; // ключ доступа — совпадает с SECRET_KEY в Apps Script
  const EXP_CHIPS = ['Вода', 'Уборка']; // быстрые категории расходов
  const DRAFT_KEY = 'kassa_draft_v1';
  const FIELD_IDS = ['nal', 'beznal', 'beznal_qr', 'qr', 'incass', 'fakt_nal'];
  /* =================================================== */

  document.getElementById('date-label').textContent =
    new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});

  let expenses = [{ id: 1, name: '', sum: '' }];
  let nextId = 2;
  let sending = false;
  let saveTimer = null;

  function v(id) { return parseFloat(document.getElementById(id).value) || 0; }

  function fmt(n) {
    return (Math.round(n * 100) / 100).toLocaleString('ru-RU', {maximumFractionDigits: 2}) + ' ₽';
  }

  function totalExp() {
    return expenses.reduce((s, e) => s + (parseFloat(e.sum) || 0), 0);
  }

  /* ==== Автосохранение черновика ==== */
  function saveDraft() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify({
          day: new Date().toDateString(),
          fields: FIELD_IDS.map(id => document.getElementById(id).value),
          expenses: expenses
        }));
      } catch (e) { /* приватный режим и т.п. — молча игнорируем */ }
    }, 250);
  }

  function loadDraft() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
    if (!d || d.day !== new Date().toDateString()) {
      if (d) localStorage.removeItem(DRAFT_KEY);
      return;
    }
    FIELD_IDS.forEach(function (id, i) {
      if (d.fields && typeof d.fields[i] === 'string') {
        document.getElementById(id).value = d.fields[i];
      }
    });
    if (Array.isArray(d.expenses) && d.expenses.length) {
      expenses = d.expenses.map(e => ({
        id: Number(e.id) || 0,
        name: String(e.name || ''),
        sum: String(e.sum || '')
      }));
      nextId = Math.max.apply(null, expenses.map(e => e.id)) + 1;
    }
  }

  /* ==== Чипы быстрых расходов ==== */
  function renderChips() {
    const box = document.getElementById('chips');
    box.innerHTML = '';
    EXP_CHIPS.forEach(function (name) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = '+ ' + name;
      b.addEventListener('click', function () { addExp(name); });
      box.appendChild(b);
    });
  }

  /* ==== Расходы: безопасная отрисовка через DOM ==== */
  function renderExp() {
    const list = document.getElementById('exp-list');
    list.innerHTML = '';

    expenses.forEach(function (exp) {
      const item = document.createElement('div');
      item.className = 'exp-item';
      item.dataset.id = exp.id;

      const nameInp = document.createElement('input');
      nameInp.type = 'text';
      nameInp.className = 'exp-name';
      nameInp.placeholder = 'Описание';
      nameInp.value = exp.name;
      nameInp.addEventListener('input', function () { updExp(exp.id, 'name', nameInp.value); });

      const sumWrap = document.createElement('div');
      sumWrap.className = 'exp-sum-wrap';

      const sumInp = document.createElement('input');
      sumInp.type = 'number';
      sumInp.placeholder = '0';
      sumInp.min = '0';
      sumInp.inputMode = 'decimal';
      sumInp.value = exp.sum;
      sumInp.addEventListener('input', function () { updExp(exp.id, 'sum', sumInp.value); });

      const cur = document.createElement('span');
      cur.className = 'cur';
      cur.textContent = '₽';

      sumWrap.appendChild(sumInp);
      sumWrap.appendChild(cur);
      item.appendChild(nameInp);
      item.appendChild(sumWrap);

      if (expenses.length > 1) {
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'del-btn';
        del.setAttribute('aria-label', 'Удалить');
        del.textContent = '×';
        del.addEventListener('click', function () { delExp(exp.id); });
        item.appendChild(del);
      }

      list.appendChild(item);
    });
  }

  function focusExpSum(id) {
    const inp = document.querySelector('.exp-item[data-id="' + id + '"] input[type="number"]');
    if (inp) inp.focus();
  }

  function updExp(id, field, val) {
    const e = expenses.find(e => e.id === id);
    if (e) e[field] = val;
    calc();
  }

  function addExp(name) {
    name = name || '';
    if (name) {
      const existing = expenses.find(e => e.name === name && String(e.sum) === '');
      if (existing) { focusExpSum(existing.id); return; }
    }
    const exp = { id: nextId++, name: name, sum: '' };
    expenses.push(exp);
    renderExp();
    calc();
    if (name) focusExpSum(exp.id);
  }

  function delExp(id) {
    expenses = expenses.filter(e => e.id !== id);
    renderExp();
    calc();
  }

  /* ==== Расчёты ==== */
  function calc() {
    const nal = v('nal'), beznal = v('beznal'), bq = v('beznal_qr'), qr = v('qr');
    const rash = totalExp();
    const incass = v('incass');
    const faktNal = v('fakt_nal');
    const faktRaw = document.getElementById('fakt_nal').value.trim();

    const itog = nal + beznal + bq + qr;
    const kassa = faktNal;
    const nalOzhid = nal - rash - incass;

    document.getElementById('itog-val').textContent = fmt(itog);
    document.getElementById('m-itog').textContent = fmt(itog);
    document.getElementById('m-rash').textContent = fmt(rash);
    document.getElementById('m-kassa').textContent = faktRaw !== '' ? fmt(kassa) : '—';

    const itogSub = document.getElementById('itog-sub');
    const parts = [];
    if (nal > 0) parts.push('нал ' + fmt(nal));
    if (beznal > 0) parts.push('безнал ' + fmt(beznal));
    if (bq > 0) parts.push('QR ' + fmt(bq));
    if (qr > 0) parts.push('СБП ' + fmt(qr));
    itogSub.textContent = parts.join(' · ');

    const kassaSub = document.getElementById('kassa-sub');
    if (faktNal > 0 && nal > 0) {
      kassaSub.textContent = (rash > 0 || incass > 0)
        ? 'ожидалось ' + fmt(nalOzhid)
        : 'нал ' + fmt(nal);
    } else {
      kassaSub.textContent = '';
    }

    const diff = Math.round((faktNal - nalOzhid) * 100) / 100;
    const db = document.getElementById('diff-block');

    if (nal > 0 && faktRaw !== '') {
      if (Math.abs(diff) < 1) {
        db.innerHTML = '<div class="diff-ok">✓&nbsp; Касса сходится</div>';
      } else {
        const sign = diff > 0
          ? 'Излишек +' + fmt(diff)
          : 'Недостача ' + fmt(Math.abs(diff));
        db.innerHTML = '<div class="diff-err">!&nbsp; ' + sign + '</div>';
      }
    } else {
      db.innerHTML = '';
    }

    saveDraft();
  }

  function buildReportText() {
    const nal = v('nal'), beznal = v('beznal'), bq = v('beznal_qr'), qr = v('qr');
    const incass = v('incass');
    const faktNal = v('fakt_nal');
    const itog = nal + beznal + bq + qr;

    let text = 'Итог — ' + Math.round(itog).toLocaleString('ru-RU') + '\n\n';
    text += 'Нал — ' + Math.round(nal).toLocaleString('ru-RU') + '\n';
    text += 'Безнал — ' + Math.round(beznal).toLocaleString('ru-RU') + '\n';
    text += 'Безнал QR — ' + Math.round(bq).toLocaleString('ru-RU') + '\n';
    text += 'QR — ' + Math.round(qr).toLocaleString('ru-RU');

    const rashLines = expenses
      .filter(e => parseFloat(e.sum) > 0)
      .map(e => {
        const s = Math.round(parseFloat(e.sum)).toLocaleString('ru-RU');
        return e.name ? e.name + ' — ' + s : s;
      })
      .join('\n');

    if (rashLines) text += '\n\nРасходы\n' + rashLines;
    if (incass > 0) text += '\n\nИнкассация — ' + Math.round(incass).toLocaleString('ru-RU');
    text += '\n\nВ кассе ' + Math.round(faktNal).toLocaleString('ru-RU');
    return text;
  }

  function copyReport() {
    const text = buildReportText();

    function onCopied() {
      const btn = document.getElementById('btn-text');
      btn.textContent = 'Скопировано ✓';
      setTimeout(() => btn.textContent = 'Скопировать отчёт', 2200);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onCopied).catch(() => fallbackCopy(text, onCopied));
    } else {
      fallbackCopy(text, onCopied);
    }
  }

  /* ==== Сохранение в Google Таблицу (бот подключается позже — на стороне скрипта) ==== */
  async function sendReport() {
    if (sending) return;

    if (!APPS_SCRIPT_URL) {
      alert('Сначала вставьте URL веб-приложения Google в настройку APPS_SCRIPT_URL (строка с пометкой-стрелкой в начале скрипта).');
      return;
    }

    const tg = window.Telegram && window.Telegram.WebApp;
    if (!tg || !tg.initData) {
      alert('Сохранение доступно внутри Telegram. В браузере пользуйтесь кнопкой «Скопировать отчёт».');
      return;
    }

    sending = true;
    const btn = document.getElementById('send-btn');
    const label = document.getElementById('send-btn-text');
    const original = label.textContent;
    btn.disabled = true;
    label.textContent = 'Сохраняем…';

    const payload = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      key: APP_KEY,
      initData: tg.initData,
      nal: v('nal'),
      beznal: v('beznal'),
      beznal_qr: v('beznal_qr'),
      qr: v('qr'),
      incass: v('incass'),
      fakt_nal: v('fakt_nal'),
      expenses: expenses.map(e => ({ name: e.name, sum: parseFloat(e.sum) || 0 }))
    };

    try {
      // text/plain — чтобы браузер не слал preflight-запрос, который Apps Script не умеет обрабатывать
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const answer = await res.json();
      if (!answer.ok) throw new Error(answer.error || 'сервер вернул ошибку');
      if (answer.warn) alert(answer.warn);

      if (tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} }
      label.textContent = 'Сохранено ✓';
      setTimeout(() => label.textContent = original, 2200);
    } catch (err) {
      label.textContent = original;
      alert('Не получилось сохранить: ' + err.message);
    } finally {
      btn.disabled = false;
      sending = false;
    }
  }

  /* ==== Очистка формы ==== */
  function clearAll() {
    const tg = window.Telegram && window.Telegram.WebApp;

    const doClear = function () {
      FIELD_IDS.forEach(function (id) { document.getElementById(id).value = ''; });
      expenses = [{ id: 1, name: '', sum: '' }];
      nextId = 2;
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      renderExp();
      calc();
      if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {} }
    };

    const msg = 'Очистить форму? Несохранённые данные будут потеряны.';

    if (tg && tg.showConfirm) {
      tg.showConfirm(msg, function (ok) { if (ok) doClear(); });
    } else if (confirm(msg)) {
      doClear();
    }
  }

  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta);

    if (navigator.userAgent.match(/ipad|iphone/i)) {
      const range = document.createRange();
      range.selectNodeContents(ta);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      ta.setSelectionRange(0, 999999);
    } else {
      ta.select();
    }

    try {
      document.execCommand('copy');
      cb();
    } catch (e) {
      alert('Не удалось скопировать. Попробуйте вручную.');
    }

    document.body.removeChild(ta);
  }

  function applyTelegramTheme(tg){
    document.documentElement.setAttribute('data-theme', tg.colorScheme === 'dark' ? 'dark' : 'light');
  }

  function initTelegram(){
    if(!window.Telegram || !window.Telegram.WebApp) return;
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    applyTelegramTheme(tg);
    if(tg.onEvent){
      tg.onEvent('themeChanged', function(){ applyTelegramTheme(tg); });
    }
  }

  initTelegram();
  loadDraft();
  renderChips();
  renderExp();
  calc();
</script>
