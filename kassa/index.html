<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Касса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500&family=Mulish:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #f5f3ef;
  --surface: #ffffff;
  --surface2: #f0ede8;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.11);
  --text: #1a1916;
  --muted: #6b6860;
  --hint: #aaa89f;
  --accent: #8b6f47;
  --accent-light: #c4a97d;
  --accent-dim: rgba(139,111,71,0.08);
  --green: #3a7d52;
  --green-bg: rgba(58,125,82,0.08);
  --red: #b84040;
  --red-bg: rgba(184,64,64,0.08);
  --radius: 16px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Mulish', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 460px;
  margin: 0 auto;
  padding: 2rem 1.25rem 5rem;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2rem;
}

.logo {
  font-family: 'Unbounded', sans-serif;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
}

.date-chip {
  font-size: 12px;
  color: var(--muted);
  font-weight: 300;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 5px 12px;
}

/* Heroes — два блока рядом */
.heroes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}

.hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  position: relative;
  overflow: hidden;
}

.hero.primary::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent-light), transparent 70%);
}

.hero-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--hint);
  font-weight: 500;
  margin-bottom: 10px;
}

.hero-val {
  font-family: 'Unbounded', sans-serif;
  font-size: 26px;
  font-weight: 300;
  letter-spacing: -0.03em;
  color: var(--accent);
  line-height: 1;
}

.hero-val.secondary {
  color: var(--text);
}

.hero-sub {
  margin-top: 6px;
  font-size: 11px;
  color: var(--hint);
  font-weight: 300;
  line-height: 1.4;
  min-height: 15px;
}

/* Расходы метрика — тонкая строка */
.rash-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
}

.rash-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--hint);
  font-weight: 500;
}

.rash-val {
  font-family: 'Unbounded', sans-serif;
  font-size: 15px;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: -0.02em;
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 8px;
}

.sec-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--hint);
  font-weight: 500;
  margin-bottom: 14px;
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
}

.row:last-of-type { border-bottom: none; }

.row-label {
  font-size: 14px;
  color: var(--muted);
  font-weight: 300;
  white-space: nowrap;
  margin-right: 12px;
}

/* СБП — слегка приглушён */
.row-label.dim { color: var(--hint); }

.row-input {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

input[type="number"] {
  width: 118px;
  text-align: right;
  font-size: 15px;
  font-family: 'Unbounded', sans-serif;
  font-weight: 300;
  color: var(--text);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  outline: none;
  letter-spacing: -0.02em;
  transition: border-color 0.15s;
  -moz-appearance: textfield;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type="number"]:focus { border-color: var(--accent); }

input[type="text"] {
  font-size: 13px;
  font-family: 'Mulish', sans-serif;
  font-weight: 400;
  color: var(--text);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  outline: none;
  transition: border-color 0.15s;
}

input[type="text"]:focus { border-color: var(--accent); }
input::placeholder { color: var(--hint); }

.cur { font-size: 12px; color: var(--hint); }

.total-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
  margin-top: 4px;
  border-top: 1px solid var(--border2);
}

.total-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
}

.total-val {
  font-family: 'Unbounded', sans-serif;
  font-size: 16px;
  font-weight: 300;
  color: var(--accent);
  letter-spacing: -0.02em;
}

/* Expenses */
.exp-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
}

.exp-item:last-of-type { border-bottom: none; }
.exp-name { flex: 1; min-width: 0; }

.exp-sum-wrap {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.exp-sum-wrap input { width: 96px; }

.del-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--hint);
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
  font-size: 17px; line-height: 1;
  flex-shrink: 0;
  transition: color 0.15s, background 0.15s;
}

.del-btn:hover { color: var(--red); background: var(--red-bg); }

.add-exp-btn {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  font-size: 12px;
  font-family: 'Mulish', sans-serif;
  color: var(--hint);
  background: none;
  border: 1px dashed var(--border2);
  border-radius: var(--radius-sm);
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}

.add-exp-btn:hover { color: var(--accent); border-color: var(--accent-light); background: var(--accent-dim); }

/* Diff */
.diff-ok {
  display: flex; align-items: center; gap: 8px;
  background: var(--green-bg);
  border: 1px solid rgba(58,125,82,0.15);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px; color: var(--green);
  margin-top: 12px; font-weight: 500;
}

.diff-err {
  display: flex; align-items: center; gap: 8px;
  background: var(--red-bg);
  border: 1px solid rgba(184,64,64,0.15);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px; color: var(--red);
  margin-top: 12px; font-weight: 500;
}

/* Copy */
.copy-btn {
  width: 100%;
  margin-top: 1.25rem;
  padding: 16px;
  font-size: 13px;
  font-family: 'Mulish', sans-serif;
  font-weight: 600;
  color: #fff;
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: opacity 0.15s, transform 0.1s;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}

.copy-btn:hover { opacity: 0.85; }
.copy-btn:active { transform: scale(0.98); }

.copy-btn.outline {
  margin-top: 8px;
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--border2);
}
.copy-btn.outline:hover { background: var(--accent-dim); opacity: 1; }

.copy-btn svg {
  width: 15px; height: 15px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  flex-shrink: 0;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.app > * { animation: fadeUp 0.4s cubic-bezier(.16,1,.3,1) both; }
header            { animation-delay: 0.04s; }
.heroes           { animation-delay: 0.08s; }
.rash-row         { animation-delay: 0.11s; }
.card:nth-child(4){ animation-delay: 0.14s; }
.card:nth-child(5){ animation-delay: 0.16s; }
.card:nth-child(6){ animation-delay: 0.18s; }
.copy-btn         { animation-delay: 0.21s; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">Касса</div>
    <div class="date-chip" id="date-label"></div>
  </header>

  <!-- Два героя: Итог + В кассе -->
  <div class="heroes">
    <div class="hero primary">
      <div class="hero-label">Итог</div>
      <div class="hero-val" id="m-itog">—</div>
      <div class="hero-sub" id="itog-sub"></div>
    </div>
    <div class="hero">
      <div class="hero-label">В кассе</div>
      <div class="hero-val secondary" id="m-kassa">—</div>
      <div class="hero-sub" id="kassa-sub"></div>
    </div>
  </div>

  <!-- Расходы — тонкая строка -->
  <div class="rash-row">
    <span class="rash-label">Расходы</span>
    <span class="rash-val" id="m-rash">—</span>
  </div>

  <!-- Итог (приход) -->
  <div class="card">
    <div class="sec-title">Итог</div>
    <div class="row">
      <span class="row-label">Нал</span>
      <div class="row-input">
        <input type="number" id="nal" placeholder="0" oninput="calc()">
        <span class="cur">₽</span>
      </div>
    </div>
    <div class="row">
      <span class="row-label">Безнал</span>
      <div class="row-input">
        <input type="number" id="beznal" placeholder="0" oninput="calc()">
        <span class="cur">₽</span>
      </div>
    </div>
    <div class="row">
      <span class="row-label">Безнал QR</span>
      <div class="row-input">
        <input type="number" id="beznal_qr" placeholder="0" oninput="calc()">
        <span class="cur">₽</span>
      </div>
    </div>
    <div class="row">
      <span class="row-label">QR (СБП)</span>
      <div class="row-input">
        <input type="number" id="qr" placeholder="0" oninput="calc()">
        <span class="cur">₽</span>
      </div>
    </div>
    <div class="total-row">
      <span class="total-label">Итого</span>
      <span class="total-val" id="itog-val">0 ₽</span>
    </div>
  </div>

  <!-- Расходы -->
  <div class="card">
    <div class="sec-title">Расходы</div>
    <div id="exp-list"></div>
    <button class="add-exp-btn" onclick="addExp()">+ добавить расход</button>
  </div>

  <!-- В кассе -->
  <div class="card">
    <div class="sec-title">В кассе (наличные)</div>
    <div class="row" style="border-bottom:none">
      <span class="row-label">Нал факт</span>
      <div class="row-input">
        <input type="number" id="fakt_nal" placeholder="0" oninput="calc()">
        <span class="cur">₽</span>
      </div>
    </div>
    <div id="diff-block"></div>
  </div>

  <button class="copy-btn" onclick="copyReport()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
    <span id="btn-text">Скопировать отчёт</span>
  </button>

  <button class="copy-btn outline" onclick="sendReport()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
    <span id="send-btn-text">Отправить в чат</span>
  </button>

</div>
<script>
  document.getElementById('date-label').textContent =
    new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});

  let expenses = [{ id: 1, name: '', sum: '' }];
  let nextId = 2;

  function v(id) { return parseFloat(document.getElementById(id).value) || 0; }

  function fmt(n) {
    return (Math.round(n * 100) / 100).toLocaleString('ru-RU', {maximumFractionDigits: 2}) + ' ₽';
  }

  function n(num) {
    return Math.round(num * 100) / 100;
  }

  function totalExp() {
    return expenses.reduce((s, e) => s + (parseFloat(e.sum) || 0), 0);
  }

  function renderExp() {
    const list = document.getElementById('exp-list');
    list.innerHTML = '';
    expenses.forEach(exp => {
      const d = document.createElement('div');
      d.className = 'exp-item';
      d.innerHTML = `
        <input class="exp-name" type="text" placeholder="Описание" value="${exp.name}"
          oninput="updExp(${exp.id},'name',this.value)" style="flex:1;min-width:0">
        <div class="exp-sum-wrap">
          <input type="number" placeholder="0" value="${exp.sum}"
            oninput="updExp(${exp.id},'sum',this.value)">
          <span class="cur">₽</span>
        </div>
        ${expenses.length > 1
          ? `<button class="del-btn" onclick="delExp(${exp.id})" aria-label="Удалить">×</button>`
          : ''}
      `;
      list.appendChild(d);
    });
  }

  function updExp(id, field, val) {
    const e = expenses.find(e => e.id === id);
    if (e) e[field] = val;
    calc();
  }

  function addExp() {
    expenses.push({ id: nextId++, name: '', sum: '' });
    renderExp();
  }

  function delExp(id) {
    expenses = expenses.filter(e => e.id !== id);
    renderExp();
    calc();
  }

  function calc() {
    const nal = v('nal'), beznal = v('beznal'), bq = v('beznal_qr'), qr = v('qr');
    const rash = totalExp();
    const faktNal = v('fakt_nal');

    // Итог = нал + безнал + безнал QR + QR (СБП)
    const itog = nal + beznal + bq + qr;

    // В кассе = нал факт (просто что посчитали)
    const kassa = faktNal;

    // Для сверки: ожидаемый нал = нал − расходы
    const nalOzhid = nal - rash;

    document.getElementById('itog-val').textContent = fmt(itog);
    document.getElementById('m-itog').textContent = fmt(itog);
    document.getElementById('m-rash').textContent = fmt(rash);
    document.getElementById('m-kassa').textContent = faktNal > 0 ? fmt(kassa) : '—';

    // Подпись под итогом
    const itogSub = document.getElementById('itog-sub');
    const parts = [];
    if (nal > 0) parts.push(`нал ${fmt(nal)}`);
    if (beznal > 0) parts.push(`безнал ${fmt(beznal)}`);
    if (bq > 0) parts.push(`QR ${fmt(bq)}`);
    if (qr > 0) parts.push(`СБП ${fmt(qr)}`);
    itogSub.textContent = parts.join(' · ');

    // Подпись под кассой
    const kassaSub = document.getElementById('kassa-sub');
    if (faktNal > 0 && rash > 0) {
      kassaSub.textContent = `ожидалось ${fmt(nalOzhid)}`;
    } else if (faktNal > 0) {
      kassaSub.textContent = `нал ${fmt(nal)}`;
    } else {
      kassaSub.textContent = '';
    }

    // Сверка
    const diff = Math.round((faktNal - nalOzhid) * 100) / 100;
    const db = document.getElementById('diff-block');

    if (faktNal > 0 || nal > 0) {
      if (Math.abs(diff) < 1) {
        db.innerHTML = `<div class="diff-ok">✓&nbsp; Касса сходится</div>`;
      } else {
        const sign = diff > 0
          ? `Излишек +${fmt(diff)}`
          : `Недостача ${fmt(Math.abs(diff))}`;
        db.innerHTML = `<div class="diff-err">!&nbsp; ${sign}</div>`;
      }
    } else {
      db.innerHTML = '';
    }
  }

  function buildReportText() {
    const nal = v('nal'), beznal = v('beznal'), bq = v('beznal_qr'), qr = v('qr');
    const itog = nal + beznal + bq + qr;
    const faktNal = v('fakt_nal');

    const rashLines = expenses
      .filter(e => parseFloat(e.sum) > 0)
      .map(e => {
        const s = Math.round(parseFloat(e.sum) || 0).toLocaleString('ru-RU');
        return e.name ? `${e.name} — ${s}` : `${s}`;
      })
      .join('\n');

    let text = `Итог — ${Math.round(itog).toLocaleString('ru-RU')}\n\n`;
    text += `Нал — ${Math.round(nal).toLocaleString('ru-RU')}\n`;
    text += `Безнал — ${Math.round(beznal).toLocaleString('ru-RU')}\n`;
    text += `Безнал QR — ${Math.round(bq).toLocaleString('ru-RU')}\n`;
    text += `QR — ${Math.round(qr).toLocaleString('ru-RU')}`;

    if (rashLines) {
      text += `\n\n${rashLines}`;
    }

    text += `\n\nВ кассе ${Math.round(faktNal).toLocaleString('ru-RU')}`;
    return text;
  }

  function copyReport() {
    const text = buildReportText();

    function onCopied() {
      const btn = document.getElementById('btn-text');
      btn.textContent = 'Скопировано ✓';
      setTimeout(() => btn.textContent = 'Скопировать отчёт', 2200);
    }

    // Современный способ (Chrome desktop, новые Safari)
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onCopied).catch(() => fallbackCopy(text, onCopied));
    } else {
      fallbackCopy(text, onCopied);
    }
  }

  const TELEGRAM_BOT_TOKEN = '8920248174:AAH6I-SN2iIVC7UFDGJdi11HjHfh9sjDznU';
  const TELEGRAM_CHAT_ID = '-1002628442313';
  const TELEGRAM_THREAD_ID = 3;

  async function sendToTelegram(text) {
    const url = 'https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage';
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, message_thread_id: TELEGRAM_THREAD_ID, text: text })
    });
    const payload = await res.json();
    if (!payload.ok) throw new Error(payload.description || 'Telegram вернул ошибку');
    return payload;
  }

  async function sendReport() {
    const text = buildReportText();
    const label = document.getElementById('send-btn-text');
    const original = label.textContent;
    label.textContent = 'Отправляем…';
    try {
      await sendToTelegram(text);
      label.textContent = 'Отправлено ✓';
      setTimeout(() => label.textContent = original, 2200);
    } catch (err) {
      label.textContent = original;
      alert('Не получилось отправить в чат: ' + err.message);
    }
  }

  // Fallback через textarea — работает на мобильном Safari и Android
  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta);

    // iOS требует особого выделения
    if (navigator.userAgent.match(/ipad|iphone/i)) {
      const range = document.createRange();
      range.selectNodeContents(ta);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      ta.setSelectionRange(0, 999999);
    } else {
      ta.select();
    }

    try {
      document.execCommand('copy');
      cb();
    } catch (e) {
      alert('Не удалось скопировать. Попробуйте вручную.');
    }

    document.body.removeChild(ta);
  }

  function initTelegram(){
    if(!window.Telegram || !window.Telegram.WebApp) return;
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    const p = tg.themeParams || {};
    const root = document.documentElement.style;
    if(p.bg_color) root.setProperty('--bg', p.bg_color);
    if(p.secondary_bg_color) root.setProperty('--surface2', p.secondary_bg_color);
    if(p.text_color) root.setProperty('--text', p.text_color);
    if(p.hint_color) root.setProperty('--muted', p.hint_color);
    if(p.button_color) root.setProperty('--accent', p.button_color);
    if(p.section_bg_color) root.setProperty('--surface', p.section_bg_color);
  }

  initTelegram();
  renderExp();
</script>
</body>
</html>
